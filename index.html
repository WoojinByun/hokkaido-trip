<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>홋카이도 공항 선택지 비교</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --fg: #1d2530; --muted: #5b6573; --line: #d9d6cc;
  --accent: #1f5f7a; --danger: #a42a2a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181e; --surface: #1d232c; --fg: #e8ecf1; --muted: #9aa5b3; --line: #343c48;
    --accent: #7fb8cf; --danger: #ef8a8a;
  }
}
:root[data-theme="dark"] {
  --bg: #14181e; --surface: #1d232c; --fg: #e8ecf1; --muted: #9aa5b3; --line: #343c48;
  --accent: #7fb8cf; --danger: #ef8a8a;
}
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font-family: "Noto Sans KR", system-ui, sans-serif; line-height: 1.5; min-height: 100vh; }
main { box-sizing: border-box; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.box { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px 20px; }
h1 { margin: 0 0 6px; font-size: 18px; }
p { margin: 0 0 16px; font-size: 14px; color: var(--muted); }
label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
input { box-sizing: border-box; width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; font-size: 16px; }
input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button { margin-top: 12px; width: 100%; min-height: 44px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent); color: var(--surface); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
#msg { min-height: 20px; margin: 10px 0 0; font-size: 14px; color: var(--danger); }
</style>
</head>
<body>
<main>
  <div class="box">
    <h1>홋카이도 공항 선택지 비교</h1>
    <p>비밀번호를 입력하면 내용이 표시됩니다.</p>
    <form id="gate" autocomplete="on">
      <label for="pw">비밀번호</label>
      <input id="pw" name="pw" type="password" autocomplete="current-password" required>
      <button id="go" type="submit">확인</button>
      <p id="msg" role="alert"></p>
    </form>
  </div>
</main>

<script>
(function () {
  var payload = JSON.parse(document.getElementById('gate-data').textContent);
  var form = document.getElementById('gate');
  var input = document.getElementById('pw');
  var btn = document.getElementById('go');
  var msg = document.getElementById('msg');

  function bytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function decrypt(pw) {
    var subtle = window.crypto.subtle;
    return subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFC')), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return subtle.deriveKey(
          { name: 'PBKDF2', salt: bytes(payload.s), iterations: payload.n, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) {
        return subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.i) }, key, bytes(payload.c));
      })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }

  if (!window.crypto || !window.crypto.subtle) {
    msg.textContent = '이 브라우저에서는 내용을 열 수 없습니다. HTTPS 주소로 다시 열어 주세요.';
    btn.disabled = true;
    return;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.textContent = '';
    btn.disabled = true;
    decrypt(input.value).then(function (html) {
      document.open();
      document.write(html);
      document.close();
    }, function () {
      btn.disabled = false;
      msg.textContent = '비밀번호가 맞지 않습니다';
      input.select();
    });
  });
})();
</script>
